name: One-off KenzieHub npm lock reconciliation
on:
  push:
    branches:
      - review/i18n-pt-en-20261013
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lock from current package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation and production build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit package-lock only when verified
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Package lock already reproducible'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lockfile): reconcile KenzieHub dependencies after clean install'
          git push origin HEAD:refs/heads/review/i18n-pt-en-20261013
